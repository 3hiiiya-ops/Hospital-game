const retorts={pack:[['온찜질은 뜨거움 대회가 아니거든요.','화상은 옵션으로 제공하지 않습니다.','안전한 온도로 적용하고 있어요.'],['뜨거운 게 좋으면 찜질방이 더 전문입니다.','피부는 교체할 수 없으니까요.','온도 조절은 안전 기준에 따라 해요.']],extra:[['옆 병원 규정은 옆 병원에 문의해 주세요.','추가 치료는 진료와 처방 기준이 있어요.','원하신다고 메뉴처럼 추가되는 건 아닙니다.']],miss:[['제 이름표에 아가씨라고 적혀 있진 않습니다.','선생님이라고 불러주시면 바로 응대할게요.','환자분, 서로 존중하면서 얘기하시죠.']],pressure:[['압이 세면 효과도 세다는 공식은 없어요.','치료받으러 오셨지 맷집 테스트하러 오신 건 아니잖아요.','통증 반응을 보면서 안전하게 조절할게요.'],['계속 더 세게라니, 근육이 아니라 바위를 찾으시나요?','더 세게는 접수됐고 몸 상태도 같이 봅시다.','압력보다 중요한 건 적절한 자극입니다.']],duration:[['제 근무시간은 고무줄이 아니거든요.','정해진 치료 시간을 지키고 있어요.','추가 치료는 별도 상담이 필요해요.']],compare:[['전 선생님은 전 선생님이고, 저는 저예요.','비교보다는 지금 불편한 부위를 알려주세요.','치료 목표는 같아도 방법은 다를 수 있어요.']],boss:[['제 몸은 두 개가 아니라서요.','환자를 더 받으려면 인력부터 늘려주세요.','우선순위부터 정해 주시면 처리하겠습니다.'],['팀워크는 업무를 무한정 떠넘기는 게 아닙니다.','실장님도 직접 해보시면 상황을 아실 겁니다.','추가 업무라면 기존 업무 조정이 먼저죠.']],coworker:[['제 것도 산더미인데요.','도와드릴 수 있는 시간부터 확인할게요.','이번엔 본인 업무부터 마무리해 주세요.']],iv:[['속도는 편의점 계산대처럼 올릴 수 없어요.','투여 속도는 처방대로 해야 해요.','안전을 위해 임의로 빠르게 할 수 없어요.']],doctor:[['네, 설명하고 순서대로 안내하겠습니다.','우선순위를 확인해서 진행할게요.','확인 후 전달드리겠습니다.']],gratitude:[['그 말씀 들으니 오늘 피로가 좀 풀리네요.','열심히 따라와 주신 덕분이죠.','그렇게 말씀해 주셔서 정말 감사해요.']]};
const neutral=['제가 순간이동까지 할 수는 없거든요.','이건 저도 납득이 잘 안 가는데요?','그렇게 말씀하셔도 가능한 범위는 달라지지 않아요.','그 말씀은 오늘 벌써 세 번째로 듣네요.','제 설명도 잠깐 들어주실래요?','선생님도 퇴근이 있는 사람입니다.','치료는 안전이 우선입니다.','그러실수록 순서가 더 꼬여요.','제가 웃고 있다고 다 괜찮다는 뜻은 아니에요.','환자분, 말투부터 한 단계만 내려주세요.','그건 제가 정할 수 있는 일이 아닙니다.','원칙은 기분 따라 바뀌지 않습니다.','오늘도 인내심 레벨업 중이네요.','아, 제 멘탈이 지금 삐걱거립니다.'];
let active=null;function showModal(speaker,line,choices){modalState=true;document.body.classList.add('inmodal');document.getElementById('modal').style.display='flex';document.getElementById('speaker').textContent=speaker;document.getElementById('line').textContent=line;document.getElementById('round').textContent=active?'대화 '+Math.min(active.round+1,6)+' / 6':'';const c=document.getElementById('choices');c.replaceChildren();choices.forEach(({text,fn})=>{let b=document.createElement('button');b.textContent=text;b.onclick=fn;c.appendChild(b)})}function closeModal(){modalState=null;active=null;document.body.classList.remove('inmodal');document.getElementById('modal').style.display='none';persist()}document.getElementById('quit').onclick=closeModal;
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2600)}function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function startTalk(){if(modalState)return;let n=nearest();if(!n){toast('가까이 있는 사람에게만 말을 걸 수 있어요.');return}active={n,round:0,variant:(encounter[n.id]||0)%banks[n.kind].length};encounter[n.id]=(encounter[n.id]||0)+1;nextRound()}
function nextRound(){if(!active)return;let {n,round,variant}=active;if(round>=6){finishTalk();return}let lines=banks[n.kind],line=lines[(round+variant)%lines.length],custom=retorts[n.kind].flat(),options=[custom[(round*2+variant)%custom.length],custom[(round*2+variant+1)%custom.length],neutral[(round*3+variant)%neutral.length]];showModal(n.name,line,options.map((t,i)=>({text:(i===0?'🔥 ':i===1?'💬 ':'😈 ')+t,fn:()=>{if(!active)return;active.round++;if(active.round>=6){finishTalk()}else nextRound()}})))}
function finishTalk(){if(!active)return;let kind=active.n.kind;active=null;if(kind==='gratitude'){coffee+=1;stress=Math.max(0,stress-1);hud();showModal('🎁 칭찬 환자 이벤트','감사 인사를 들었어요! 가상의 커피 쿠폰 +1 ☕\n스트레스 -1', [{text:'고맙습니다!',fn:closeModal}])}else if(['doctor'].includes(kind)){showModal('✨ 일상 업무 완료','무사히 이야기를 마쳤습니다.',[{text:'돌아가기',fn:closeModal}])}else{stress=Math.min(8,stress+1);hud();if(stress>=8){showModal('🤯 스트레스 한계!','정신적 타격을 8번 받았습니다!\n오늘은 이쯤에서 퇴근해도 되겠는데요?', [{text:'🏠 퇴근하고 다음 날 출근',fn:()=>{day++;stress=0;player.x=24;player.y=30.6;player.smoking=false;hud();closeModal();toast('다음 날 출근했습니다. 멘탈 초기화!')}},{text:'오늘 조금 더 버티기',fn:closeModal}])}else showModal('🥊 말싸움 종료','6라운드 티키타카 완료!\n정신적 타격 +1 ('+stress+'/8)\n다음에 다시 만나면 대사가 달라집니다.',[{text:'후... 다시 일하자',fn:closeModal}])}persist()}
document.getElementById('talk').onclick=startTalk;document.getElementById('reset').onclick=()=>{player.x=24;player.y=30.6;player.smoking=false;smokePrompted=false;persist();toast('로비 입구로 이동했습니다. 기록은 유지돼요.')};document.getElementById('journal').onclick=()=>showModal('📋 근무일지','근무 '+day+'일차\n정신적 타격 '+stress+'/8\n가상 커피 쿠폰 '+coffee+'개\n대화한 횟수 '+Object.values(encounter).reduce((a,b)=>a+b,0)+'회\n벽에 끼면 로비 복귀 버튼을 이용하세요.',[{text:'계속 근무하기',fn:closeModal},{text:'오늘 퇴근하기',fn:()=>{day++;stress=0;player.x=24;player.y=30.6;player.smoking=false;hud();closeModal();toast('새로운 근무일이 시작됐습니다.')}}]);
const rooms=[['출입구',24,30.6],['물리치료실',7,10.8],['진료실 1',20,10.8],['진료실 2',30,10.8],['수액실',42,10.8],['도수치료실 1',5,22.9],['도수치료실 2',12,22.9],['도수치료실 3',21,22.9],['원무과',30,26.6],['흡연실',43,23.6]];
document.getElementById('rooms').onclick=()=>showModal('🗺️ 병원 안내도','모든 방은 넓은 중앙 복도로 연결돼 있어요.\n이동이 어려울 때만 바로가기를 사용하세요.',rooms.map(([label,x,y])=>({text:'📍 '+label,fn:()=>{if(player.smoking&&label!=='흡연실'){showModal('🚬 흡연실','담배를 끄시겠습니까?', [{text:'예 · 끄고 이동',fn:()=>{player.smoking=false;player.x=x;player.y=y;recover();closeModal()}},{text:'아니오',fn:closeModal}]);return}player.x=x;player.y=y;recover();closeModal();enterSmokeCheck()}})));
})();
