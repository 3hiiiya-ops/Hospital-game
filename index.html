<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#263944"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="퇴근하고싶다"><title>오늘도 퇴근 못 했습니다</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#152b35;color:#f6f2de;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;touch-action:none}#app{height:100dvh;max-width:700px;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 7px) 9px calc(env(safe-area-inset-bottom) + 7px);gap:8px}header{border:3px solid #8ca7a0;background:#2a4854;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 3px #0a1b20}header strong{font-size:14px}#meter{font-size:12px;font-weight:bold;white-space:nowrap}#bar{height:8px;background:#142830;border:1px solid #bbcabf;margin-top:3px;width:112px}#fill{height:100%;background:#f2ad66;width:0%;transition:width .2s}#world{position:relative;flex:1;min-height:0;border:4px solid #8ca7a0;box-shadow:0 4px #101d23;background:#b5c7bc;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#tip{position:absolute;left:8px;top:8px;background:#234650e8;border:2px solid #adbdad;padding:5px 7px;font-size:11px;max-width:80%;pointer-events:none}#dialog{position:absolute;z-index:3;bottom:9px;left:8px;right:8px;background:#f8ebca;color:#253941;border:4px solid #3c5257;padding:10px;box-shadow:3px 3px #12242a;display:none;max-height:62%;overflow-y:auto}#dialog .name{font-weight:900;color:#a94c53;font-size:14px}#dialog p{white-space:pre-line;line-height:1.5;margin:7px 0 10px;font-weight:650;font-size:14px}.choices{display:grid;gap:6px}.choices button{border:2px solid #294b52;background:#52808a;color:white;text-align:left;padding:9px;font-size:13px;font-weight:750;border-radius:0}.choices button:active{background:#e68e6c}#control{display:flex;justify-content:space-between;gap:9px;align-items:center;min-height:145px}#pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,42px);gap:3px}button{touch-action:manipulation;cursor:pointer}#pad button,.action{background:#456b75;color:#fff;border:3px solid #9bb1aa;box-shadow:0 3px #112b32;font-size:19px;font-weight:900;border-radius:7px}#pad button:active,.action:active{transform:translateY(2px);box-shadow:none}#pad .empty{visibility:hidden}#right{display:flex;align-items:center;flex-direction:column;gap:9px;flex:1}.action{padding:11px 15px;min-height:50px;width:min(100%,180px);font-size:15px}#log{font-size:11px;text-align:center;opacity:.82}footer{text-align:center;font-size:10px;opacity:.7}@media(max-height:610px){#control{min-height:110px}#pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,33px)}.action{min-height:40px;padding:7px}}
</style></head><body><div id="app"><header><div><strong>🏥 오늘도 퇴근 못 했습니다</strong><div style="font-size:11px;color:#b7d4cf" id="day">1일 차 · 물리치료실</div></div><div id="meter">🤯 스트레스 <span id="counter">0 / 8</span><div id="bar"><div id="fill"></div></div></div></header><div id="world"><canvas id="canvas" width="480" height="408"></canvas><div id="tip">방향키로 이동 · 가까이서 💬 대화</div><div id="dialog"><div class="name" id="speaker"></div><p id="speech"></p><div class="choices" id="choices"></div></div></div><div id="control"><div id="pad"><span class="empty"></span><button data-dir="up">▲</button><span class="empty"></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button><span class="empty"></span><span class="empty"></span></div><div id="right"><button class="action" id="talk">💬 대화 / 선택</button><button class="action" id="journal">📋 오늘의 기록</button><div id="log">8번 타격받으면 퇴근 선택지가 열린다!</div></div></div><footer>진짜 병원 아님 · 직장인의 가상 한풀이 게임 · 자동 저장</footer></div><script>
const C=document.getElementById('canvas'),ctx=C.getContext('2d');ctx.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);let state={x:7,y:9,stress:0,day:1,events:[],wins:0,ending:false};try{Object.assign(state,JSON.parse(localStorage.getItem('hospital-revenge-v1')||'{}'))}catch(e){};let busy=false,selected=null,held=null,lastMove=0;const TILE=32,W=15,H=12;C.width=W*TILE;C.height=H*TILE;
const npcs=[{id:'patient',x:3,y:3,name:'까다로운 환자',kind:'patient',color:'#c96f78',lines:[['아니, 내 돈 내고 치료받는데 왜 더 안 해줘요?','그럼 원래 정해진 시간을 지키셔야죠.','불편한 건 알지만 다른 환자 차례도 있어요.','제 퇴근 시간까지 사 가신 건 아니잖아요?'],['예약 시간보다 20분 늦었는데 먼저 해주시면 안 돼요?','순서대로 안내드릴게요.','시간을 지키는 환자분들도 계세요.','그럼 시간을 되돌리는 기계부터 가져오세요.']]},{id:'boss',x:11,y:3,name:'잔소리 실장',kind:'boss',color:'#8574b9',lines:[['선생님, 오늘 환자 조금만 더 받으면 안 될까요?','일정부터 조정해 주세요.','현재 예약이 꽉 차서 어렵습니다.','그럼 실장님이 치료해 주세요 ^^'],['다들 힘든데 좀 유연하게 합시다.','업무 분담이 먼저 아닌가요?','구체적으로 조정할 부분을 말씀해 주세요.','유연함이 왜 항상 제 허리에서 나와요?']]},{id:'coworker',x:10,y:8,name:'일 떠넘기는 동료',kind:'coworker',color:'#e9b66d',lines:[['아, 이 환자만 대신 좀 봐줄 수 있어요?','이번엔 어렵다고 말한다.','교대 시간을 확인해 본다.','제 분신을 먼저 구해오세요.']]},{id:'desk',x:3,y:8,name:'원무과 직원',kind:'desk',color:'#6aadb6',lines:[['오늘도 민원이 있었어요. 수고 많으세요.','덕분에 기운이 조금 나네요.','오늘 있었던 일 좀 들어주실래요?','민원은 민원인에게 반송 안 되나요?']]},{id:'vending',x:12,y:9,name:'수상한 자판기',kind:'vending',color:'#98ab72',lines:[['자판기에 「사이다 발언 충전권」이 붙어 있다.','사이다 한 캔 마시기','자판기와 말싸움하기','일단 지나간다']]}];
const walls=new Set();for(let x=0;x<W;x++){walls.add(x+',0');walls.add(x+','+(H-1))}for(let y=0;y<H;y++){walls.add('0,'+y);walls.add((W-1)+','+y)};[[2,2],[3,2],[4,2],[10,2],[11,2],[12,2],[2,7],[3,7],[4,7],[9,7],[10,7],[11,7],[12,8]].forEach(([x,y])=>walls.add(x+','+y));
function save(){localStorage.setItem('hospital-revenge-v1',JSON.stringify(state))}function sync(){$('day').textContent=state.day+'일 차 · 물리치료실';$('counter').textContent=state.stress+' / 8';$('fill').style.width=state.stress/8*100+'%';$('fill').style.background=state.stress>=8?'#f17c86':'#f2ad66'}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function room(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){rect(x*32,y*32,32,32,(x+y)%2?'#b5c9c0':'#bfcec3');rect(x*32+1,y*32+1,30,30,(x+y)%2?'#bbccc0':'#c4d4c8')}for(let x=0;x<W;x++){rect(x*32,0,32,32,'#577b83');rect(x*32,(H-1)*32,32,32,'#577b83')}for(let y=0;y<H;y++){rect(0,y*32,32,32,'#577b83');rect((W-1)*32,y*32,32,32,'#577b83')}for(const [x,y] of [[2,2],[3,2],[4,2],[10,2],[11,2],[12,2],[2,7],[3,7],[4,7],[9,7],[10,7],[11,7]]){rect(x*32,y*32,32,32,'#648c91');rect(x*32+3,y*32+3,26,24,'#d9e9d5');rect(x*32+5,y*32+8,22,11,'#87b9b0')}rect(12*32,8*32,32,32,'#8b7471');rect(12*32+4,8*32+4,24,24,'#e5d6b2');for(const [x,y] of [[7,2],[6,6],[8,6]]){rect(x*32+3,y*32+5,26,19,'#e7dfb8');rect(x*32+5,y*32+8,22,8,'#a5c5ba')}rect(32,32,90,16,'#f6eccd');ctx.fillStyle='#344e57';ctx.font='bold 11px sans-serif';ctx.fillText('치 료 실',41,44);rect(9*32,32,112,16,'#f6eccd');ctx.fillText('실장실 / 접수',9*32+9,44)}
function person(x,y,color,player=false){let px=x*32,py=y*32;rect(px+11,py+5,12,7,'#483b42');rect(px+9,py+11,16,10,'#ecc29d');rect(px+7,py+21,20,8,color);rect(px+8,py+29,7,3,'#445460');rect(px+19,py+29,7,3,'#445460');rect(px+13,py+15,2,2,'#35393c');rect(px+20,py+15,2,2,'#35393c');if(player){rect(px+6,py+20,3,7,'#f5f5e5');rect(px+26,py+20,3,7,'#f5f5e5')}}
function draw(){room();for(const n of npcs){person(n.x,n.y,n.color);if(Math.abs(n.x-state.x)+Math.abs(n.y-state.y)<=2){ctx.fillStyle='#fff4b4';ctx.font='bold 18px sans-serif';ctx.fillText('!',n.x*32+12,n.y*32+2)}}person(state.x,state.y,'#f1f2df',true);requestAnimationFrame(draw)}function near(){return npcs.filter(n=>Math.abs(n.x-state.x)+Math.abs(n.y-state.y)<=2).sort((a,b)=>(Math.abs(a.x-state.x)+Math.abs(a.y-state.y))-(Math.abs(b.x-state.x)+Math.abs(b.y-state.y)))[0]}
function step(dir){if(busy)return;let dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0,x=state.x+dx,y=state.y+dy;if(!walls.has(x+','+y)&&!npcs.some(n=>n.x===x&&n.y===y)){state.x=x;state.y=y;save()}const n=near();$('tip').textContent=n?'💬 '+n.name+'에게 말을 걸어보자':'방향키로 이동 · 가까이서 💬 대화'}
function show(who,message,options){busy=true;$('dialog').style.display='block';$('speaker').textContent=who;$('speech').textContent=message;$('choices').replaceChildren();options.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('choices').appendChild(b)})}function close(){busy=false;$('dialog').style.display='none';selected=null}
function hit(message){state.stress=Math.min(8,state.stress+1);$('log').textContent='💢 '+message+' ('+state.stress+'/8)';sync();save()}
function encounter(n){selected=n;let variant=Math.floor(Math.random()*n.lines.length),line=n.lines[variant],isHostile=n.kind==='patient'||n.kind==='boss'||n.kind==='coworker';if(isHostile)hit(n.name+'의 정신적 타격!');show(n.name,line[0],line.slice(1).map((c,i)=>[c,()=>outcome(n,i)]))}
function outcome(n,i){let witty=i===2,peace=i===1;if(n.kind==='vending'){if(i===0){state.stress=Math.max(0,state.stress-1);sync()}show('수상한 자판기',i===1?'자판기: 삐빅. 논리적 패배입니다.':i===0?'사이다를 마시니 스트레스가 1 줄었다.':'그냥 지나가기로 했다.',[['확인',close]]);save();return}state.wins+=witty?1:0;state.events.push((witty?'🎉 ':peace?'✅ ':'💬 ')+n.name+': '+(witty?'통쾌한 반격 성공!':peace?'침착한 대응!':'할 말은 했다!'));state.events=state.events.slice(-20);save();let result=witty?['말싸움 배틀 승리! 상대가 잠깐 말문이 막혔다.','복도에서 누군가 조용히 엄지를 들어준다.','머릿속 관객들이 기립박수를 친다.'][Math.floor(Math.random()*3)]:peace?'상대가 잠시 멈칫한다. 오늘도 선은 지켰다.':'작지만 소중한 한마디!';if(state.stress>=8)result+='\n\n🚨 스트레스 8칸 달성! 이제 퇴근할 수 있다.';show(i===2?'⚡ 사이다 반격!':'결과',result,[['좋아, 계속 돌아다니기',close],...(state.stress>=8?[['🔥 더는 못 참아! 퇴근!',ending]]:[])])}
function ending(){state.ending=true;save();show('🌆 칼퇴 엔딩','타격 8번을 버틴 당신.\n\n“오늘은 여기까지 하겠습니다.”\n\n문밖으로 나가자 노을이 당신 편을 들어준다. 상사는 멀리서 부르지만 당신은 못 들은 척한다.\n\n🏆 오늘의 한풀이 성공! 사이다 반격 '+state.wins+'회',[['다음 근무일 시작',()=>{state.day++;state.stress=0;state.ending=false;state.x=7;state.y=9;sync();save();close()}],['오늘의 기록 보기',journal]])}
function journal(){const opts=[['돌아가기',close]];if(state.stress>=8)opts.push(['🔥 지금 퇴근하기',ending]);opts.push(['기록 초기화',()=>show('정말 초기화할까?','진행 상황과 근무 기록이 모두 삭제된다.',[['취소',journal],['초기화',()=>{localStorage.removeItem('hospital-revenge-v1');state={x:7,y:9,stress:0,day:1,events:[],wins:0,ending:false};sync();close()}]])]);show('📋 오늘의 근무 기록','근무 '+state.day+'일 차\n스트레스 '+state.stress+'/8 · 사이다 반격 '+state.wins+'회\n\n'+(state.events.length?state.events.slice(-6).join('\n'):'아직 일어난 사건이 없다.'),opts)}
$('talk').onclick=()=>{if(busy)return;let n=near();if(n)encounter(n);else if(state.stress>=8)show('🚪 퇴근의 유혹','8번의 타격을 견뎠다. 이제 나가도 된다.',[['퇴근하기',ending],['조금 더 돌아다니기',close]]);else show('속마음','누군가에게 가까이 다가가 말을 걸어보자.\n8번 타격받으면 퇴근 이벤트가 열린다.',[['알겠어',close]])};$('journal').onclick=journal;for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();held=b.dataset.dir;step(held);b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>held=null);b.addEventListener('pointercancel',()=>held=null)}setInterval(()=>{if(held&&!busy)step(held)},155);document.addEventListener('keydown',e=>{const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(keys[e.key]){e.preventDefault();step(keys[e.key])}if(e.key===' '||e.key==='Enter'){e.preventDefault();$('talk').click()}});sync();draw();if(state.ending)ending();
</script></body></html>
