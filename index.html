for(const x of [2,10,19]){furniture(x,25,2,3,'bed','#9fbab2');furniture(x+2,25,1,3,'curtain','#75a49b',false)}

let hint=document.getElementById('hint');function tick(t){let dt=Math.min(.04,(t-last)/1000);last=t;advanceEscape(dt);if(downDir){let v=dirs[downDir];move(v[0],v[1],dt)}else{let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);move(dx,dy,dt)}const n=nearest();hint.style.display=n&&!modalState?'block':'none';hint.textContent=n?'💬 '+n.name+' · 대화 가능':'';requestAnimationFrame(tick)}const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Enter')startTalk()});addEventListener('keyup',e=>{keys[e.key]=false});for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();downDir=b.dataset.dir;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(downDir===b.dataset.dir)downDir=null})}requestAnimationFrame(tick);

let active=null;function showModal(speaker,line,choices){modalState=true;document.body.classList.add('inmodal');document.getElementById('modal').style.display='flex';document.getElementById('speaker').textContent=speaker;document.getElementById('line').textContent=line;document.getElementById('round').textContent=active?'대화 '+Math.min(active.round+1,6)+' / 6':'';const c=document.getElementById('choices');c.replaceChildren();choices.forEach(({text,fn})=>{let b=document.createElement('button');b.textContent=text;b.onclick=fn;c.appendChild(b)})}function closeModal(){modalState=null;active=null;document.body.classList.remove('inmodal');document.getElementById('modal').style.display='none';persist()}document.getElementById('quit').onclick=closeModal;
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2600)}function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function startTalk(){if(rageMode){toast('🔥 다들 도망가는 중이라 대화할 수 없어요!');return}if(modalState)return;let n=nearest();if(!n){toast('가까이 있는 사람에게만 말을 걸 수 있어요.');return}active={n,round:0,variant:(encounter[n.id]||0)%banks[n.kind].length};encounter[n.id]=(encounter[n.id]||0)+1;nextRound()}
function nextRound(){if(!active)return;let {n,round,variant}=active;if(round>=6){finishTalk();return}let lines=banks[n.kind],line=lines[(round+variant)%lines.length],custom=retorts[n.kind].flat(),options=[custom[(round*2+variant)%custom.length],custom[(round*2+variant+1)%custom.length],neutral[(round*3+variant)%neutral.length]];showModal(n.name,line,options.map((t,i)=>({text:(i===0?'🔥 ':i===1?'💬 ':'😈 ')+t,fn:()=>{if(!active)return;active.round++;if(active.round>=6){finishTalk()}else nextRound()}})))}
function finishTalk(){if(!active)return;let kind=active.n.kind;active=null;if(kind==='gratitude'){coffee+=1;stress=Math.max(0,stress-1);hud();showModal('🎁 칭찬 환자 이벤트','감사 인사를 들었어요! 가상의 커피 쿠폰 +1 ☕\n스트레스 -1', [{text:'고맙습니다!',fn:closeModal}])}else if(['doctor'].includes(kind)){showModal('✨ 일상 업무 완료','무사히 이야기를 마쳤습니다.',[{text:'돌아가기',fn:closeModal}])}else{stress=Math.min(8,stress+1);hud();if(stress>=8){showModal('🤯 스트레스 한계!','정신적 타격을 8번 받았습니다!\n오늘은 이쯤에서 퇴근해도 되겠는데요?', [{text:'🏠 퇴근하고 다음 날 출근',fn:()=>{day++;stress=0;player.x=25;player.y=28.8;player.smoking=false;hud();closeModal();toast('다음 날 출근했습니다. 멘탈 초기화!')}},{text:'오늘 조금 더 버티기',fn:closeModal}])}else showModal('🥊 말싸움 종료','6라운드 티키타카 완료!\n정신적 타격 +1 ('+stress+'/8)\n다음에 다시 만나면 대사가 달라집니다.',[{text:'후... 다시 일하자',fn:closeModal}])}persist()}
document.getElementById('talk').onclick=startTalk;document.getElementById('reset').onclick=()=>{player.x=25;player.y=28.8;player.smoking=false;smokePrompted=false;persist();toast('로비 입구로 이동했습니다. 기록은 유지돼요.')};document.getElementById('journal').onclick=()=>showModal('📋 근무일지','근무 '+day+'일차\n정신적 타격 '+stress+'/8\n가상 커피 쿠폰 '+coffee+'개\n대화한 횟수 '+Object.values(encounter).reduce((a,b)=>a+b,0)+'회\n벽에 끼면 로비 복귀 버튼을 이용하세요.',[{text:'🧪 테스트: 스트레스 5칸 만들기',fn:()=>{stress=Math.max(stress,5);hud();closeModal();toast('테스트용 스트레스 5/8! 🔥 극대노 버튼을 누르세요.')}},{text:'계속 근무하기',fn:closeModal},{text:'오늘 퇴근하기',fn:()=>{day++;stress=0;player.x=25;player.y=28.8;player.smoking=false;hud();closeModal();toast('새로운 근무일이 시작됐습니다.')}}]);
